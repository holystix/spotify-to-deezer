[project]
name = "s2d"
version = "0.1.0"
description = "Migrate Spotify Liked Songs to Deezer Favourite Tracks, preserving date-added order"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "python-dotenv>=1.0",
]

[project.scripts]
s2d = "s2d.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2d"]

[dependency-groups]
dev = [
    "basedpyright==1.39.10",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.16.6",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "ANN"]
ignore = ["ANN401"]
allowed-confusables = ["’"]

[tool.ruff.lint.isort]
known-first-party = ["s2d"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["s2d"]

[tool.coverage.report]
show_missing = true
